<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0d1224">
  <meta name="description" content="Polderland — a pixel-art strategy game about keeping the North Sea out of a Dutch polder.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Polderland</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%231b5078'/%3E%3Crect y='9' width='16' height='7' fill='%234d7a40'/%3E%3Crect y='8' width='16' height='1' fill='%237fb45f'/%3E%3Crect x='7' y='2' width='2' height='7' fill='%236b4a31'/%3E%3Crect x='3' y='1' width='10' height='1' fill='%23d2c6a9'/%3E%3Crect x='7' y='0' width='2' height='1' fill='%23d2c6a9'/%3E%3Crect x='2' y='3' width='12' height='1' fill='%23d2c6a9'/%3E%3C/svg%3E">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    /*
     * The notch and the home indicator, published where script can read them.
     * env() is only usable inside a declaration, so it is parked on custom
     * properties that getComputedStyle will resolve to pixels.
     */
    :root {
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-right: env(safe-area-inset-right, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-left: env(safe-area-inset-left, 0px);
    }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0d1224;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none; user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #game {
      position: fixed; inset: 0;
      display: flex; align-items: center; justify-content: center;
      /* Keep the canvas clear of notches and home indicators. */
      padding: var(--safe-top) var(--safe-right) var(--safe-bottom) var(--safe-left);
    }
    canvas { display: block; image-rendering: pixelated; }

  </style>
</head>
<body>
  <div id="game"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
